<head>

<title>Lern-Reisen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    color: #2a2a4a;
    transition: background 0.6s ease;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd6e8 0%, #b5e8ff 50%, #d4ffd6 100%);
  }
  body.spiele-mode {
    background: linear-gradient(135deg, #ff6b9d 0%, #ffd166 50%, #74b9ff 100%);
  }
  body.wissen-mode {
    background: linear-gradient(135deg, #b5e8ff 0%, #d4ffd6 50%, #fff8c8 100%);
  }

  header {
    text-align: center;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(38px, 7vw, 80px);
    color: #6a1b9a;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(106,27,154,0.2);
    margin-bottom: 10px;
    animation: title-wobble 3s ease-in-out infinite;
  }
  @keyframes title-wobble {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }
  .subtitle {
    font-size: clamp(18px, 2.5vw, 26px);
    color: #d81b60;
  }

  /* === Big switcher === */
  .switcher {
    display: flex;
    gap: 18px;
    margin: 18px 0 30px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 720px;
  }
  .switch-btn {
    flex: 1;
    min-width: 220px;
    background: linear-gradient(135deg, #fff, #f0e6f7);
    border: 6px solid #6a1b9a;
    color: #6a1b9a;
    padding: 24px 18px;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(20px, 4vw, 28px);
    box-shadow: 0 10px 0 rgba(106,27,154,0.3), 0 14px 20px rgba(0,0,0,0.18);
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  .switch-btn .icon {
    font-size: clamp(50px, 10vw, 80px);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
  }
  .switch-btn:hover { transform: translateY(-4px) scale(1.03); }
  .switch-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(106,27,154,0.3); }
  .switch-btn.spiele.active {
    background: linear-gradient(135deg, #ff6b9d, #ec407a);
    color: #fff;
    border-color: #fff;
    box-shadow: 0 10px 0 #8e1f4e, 0 0 30px rgba(255,107,157,0.6);
    transform: scale(1.05);
  }
  .switch-btn.wissen.active {
    background: linear-gradient(135deg, #74b9ff, #0984e3);
    color: #fff;
    border-color: #fff;
    box-shadow: 0 10px 0 #074a87, 0 0 30px rgba(116,185,255,0.7);
    transform: scale(1.05);
  }

  /* === Tag filter (sub-categories) === */
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    max-width: 1100px;
  }
  .filter-btn {
    background: rgba(255,255,255,0.85);
    border: 3px solid #6a1b9a;
    color: #6a1b9a;
    padding: 8px 18px;
    border-radius: 22px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    font-size: 15px;
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .filter-btn:hover { transform: translateY(-2px); }
  .filter-btn.active {
    background: linear-gradient(135deg, #6a1b9a, #d81b60);
    color: #fff;
    border-color: #fff;
    box-shadow: 0 4px 0 #3d0a5a;
  }

  /* === Topic grid === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    width: 100%;
    max-width: 1280px;
  }
  .card {
    background: rgba(255,255,255,0.9);
    border-radius: 30px;
    padding: 22px 16px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 8px 0 rgba(106,27,154,0.15), 0 12px 24px rgba(0,0,0,0.08);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s;
    cursor: pointer;
    border: 4px solid transparent;
    position: relative;
    overflow: hidden;
    animation: card-in 0.5s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:nth-child(3) { animation-delay: 0.1s; }
  .card:nth-child(4) { animation-delay: 0.15s; }
  .card:nth-child(5) { animation-delay: 0.2s; }
  .card:nth-child(6) { animation-delay: 0.25s; }
  .card:nth-child(7) { animation-delay: 0.3s; }
  .card:nth-child(8) { animation-delay: 0.35s; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover {
    transform: translateY(-10px) scale(1.03) rotate(-1deg);
    box-shadow: 0 18px 0 rgba(106,27,154,0.18), 0 22px 32px rgba(0,0,0,0.18);
    border-color: #ff6b9d;
  }
  .card-emoji {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 10px;
    display: block;
    animation: floaty 3.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .card:hover .card-emoji {
    transform: scale(1.18) rotate(-8deg);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
  }
  .card:nth-child(2n) .card-emoji { animation-delay: 0.4s; }
  .card:nth-child(3n) .card-emoji { animation-delay: 0.8s; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }
  .card h2 {
    font-size: clamp(18px, 2.4vw, 24px);
    color: #6a1b9a;
    margin-bottom: 6px;
  }
  .card p {
    font-size: clamp(13px, 1.6vw, 16px);
    color: #2a2a4a;
    line-height: 1.35;
  }
  .card .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    background: #6a1b9a;
  }
  .card[data-tag="game"]    .tag { background: #ec407a; }
  .card[data-tag="body"]    .tag { background: #ff6b9d; }
  .card[data-tag="world"]   .tag { background: #74b9ff; }
  .card[data-tag="nature"]  .tag { background: #00b894; }
  .card[data-tag="emo"]     .tag { background: #d6a2ff; color: #3d0a5a; }
  .card[data-tag="abc"]     .tag { background: #f59e0b; }
  .card[data-tag="cam"]     .tag { background: #6a1b9a; }
  .card[data-tag="story"]   .tag { background: #5d4e8a; }

  .card[data-cat="spiele"]  { border-top: 8px solid #ec407a; }
  .card[data-cat="wissen"]  { border-top: 8px solid #74b9ff; }
  .card.hide { display: none; }

  footer {
    margin-top: 40px;
    font-size: 16px;
    color: #6a1b9a;
    opacity: 0.7;
    text-align: center;
  }

  @media (max-width: 600px) {
    .switch-btn { min-width: 140px; padding: 18px 12px; }
    h1 { font-size: 32px; }
    .grid { gap: 14px; }
  }
</style>

function setMode(m) {

  document.body.classList.toggle('wissen-mode', m === 'wissen');
  document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.switch-btn.' + m).classList.add('active');
  renderFilters();
  renderGrid();
}
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderGrid();
}
function renderFilters() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  FILTERS[mode].forEach(f => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (f.id === filter ? ' active' : '');
    b.dataset.f = f.id;
    b.textContent = f.label;
    b.onclick = () => setFilter(f.id);
    row.appendChild(b);
  });
}
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const items = TOPICS.filter(t => t.cat === mode && (filter === 'all' || t.filter === filter));
  items.forEach(t => {
    const card = document.createElement('a');
    card.className = 'card';
    card.dataset.cat = t.cat;
    card.dataset.tag = t.tag;
    card.href = t.href;
    card.innerHTML =
      '<span class="card-emoji">' + t.icon + '</span>' +
      '<h2>' + t.title + '</h2>' +
      '<p>' + t.desc + '</p>';
    grid.appendChild(card);
  });
}

// Init
setMode('spiele');
</script>
