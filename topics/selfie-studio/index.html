<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-cache, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<title>Selfie-Studio</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(135deg, #ffd6e8 0%, #fff8c8 50%, #b5e8ff 100%); }
  h1, h2 { color: #d6336c; text-shadow: 2px 2px 0 #fff; }

  .studio-wrap {
    position: relative;
    width: min(95vw, 640px);
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 4px solid #ffd700;
    margin: 12px 0;
    touch-action: none;
  }
  #video { display: none; }
  #canvas { width: 100%; height: 100%; display: block; }
  .sticker-layer { position: absolute; inset: 0; pointer-events: none; }
  .sticker-layer .sticker {
    position: absolute;
    font-size: 70px;
    cursor: grab;
    user-select: none;
    pointer-events: auto;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    transition: transform 0.15s;
  }
  .sticker-layer .sticker:hover { transform: translate(-50%, -50%) scale(1.1); }
  .sticker-layer .sticker.dragging { transform: translate(-50%, -50%) scale(1.15); z-index: 100; }
  .sticker-layer .sticker.selected { outline: 3px dashed #ffd700; outline-offset: 4px; border-radius: 50%; }

  .sticker-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(255,255,255,0.7);
    padding: 12px;
    border-radius: 22px;
    max-width: 700px;
  }
  .sticker-picker button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    border: 3px solid #ec407a;
    cursor: pointer;
    font-size: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .sticker-picker button:hover { transform: scale(1.15) rotate(-6deg); }

  .controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 8px 0;
  }
  .info {
    background: rgba(255,255,255,0.92);
    padding: 8px 18px;
    border-radius: 16px;
    color: #d6336c;
    font-weight: bold;
  }
  .flash {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9999;
  }
  .flash.fire { animation: f-anim 0.5s ease-out; }
  @keyframes f-anim { 0%{opacity:0;} 20%{opacity:1;} 100%{opacity:0;} }
</style>
</head>
<body>
<div id="app">
  <a class="home-btn" href="../../index.html">🏠</a>
  <button class="home-btn sound-btn" id="soundBtn">🔊</button>
  <div class="progress" id="progress"></div>

  <section class="scene active" data-scene="0">
    <div class="big-emoji floaty">📸👑✨</div>
    <h1>Selfie-Studio</h1>
    <p>Schmücke dein Selfie mit lustigen Stickern!<br/>Kronen, Brillen, Herzen — alles dabei. 💖</p>
    <button class="purple" onclick="engine.next()">Los geht's! 📷</button>
  </section>

  <section class="scene" data-scene="1">
    <div class="studio-wrap" id="studio">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="sticker-layer" id="stickerLayer"></div>
    </div>
    <button class="small green" id="startBtn" onclick="startCam()">📷 Kamera an</button>
    <div class="sticker-picker" id="stickerPicker" style="display:none">
      <button onclick="addSticker('👑')">👑</button>
      <button onclick="addSticker('🕶️')">🕶️</button>
      <button onclick="addSticker('👓')">👓</button>
      <button onclick="addSticker('🎩')">🎩</button>
      <button onclick="addSticker('🐱')">🐱</button>
      <button onclick="addSticker('🦄')">🦄</button>
      <button onclick="addSticker('👃')">👃</button>
      <button onclick="addSticker('👄')">👄</button>
      <button onclick="addSticker('💖')">💖</button>
      <button onclick="addSticker('⭐')">⭐</button>
      <button onclick="addSticker('🌈')">🌈</button>
      <button onclick="addSticker('🌸')">🌸</button>
      <button onclick="addSticker('🦋')">🦋</button>
      <button onclick="addSticker('💎')">💎</button>
    </div>
    <div class="controls-row" id="controlsRow" style="display:none">
      <button class="green" onclick="snapSelfie()">📸 Foto machen!</button>
      <button class="small secondary" onclick="clearStickers()">🧹 Sticker weg</button>
      <button class="small secondary" onclick="removeSelected()">❌ Diesen löschen</button>
    </div>
    <div class="info" id="info">📷 Erst Kamera anmachen, dann Sticker drauf!</div>
    <button class="purple" onclick="engine.next()" style="margin-top:8px">Weiter ➡️</button>
  </section>

  <section class="scene" data-scene="2">
    <div class="big-emoji pulse">📸💖</div>
    <h2>Perfekte Selfies!</h2>
    <p>Du kannst Sticker ziehen, neue dazumachen — und ein Foto schießen.<br/>
       Zeig dein Lieblings-Selfie deinen Eltern! 💕</p>
    <button class="green" onclick="engine.goTo(0)">🔁 Nochmal</button>
  </section>
</div>

<div class="flash" id="flash"></div>
<div class="nav"><button class="secondary" id="prevBtn">⬅️ Zurück</button></div>
<script src="../../shared/engine.js"></script>
<script>
const SCENE_TEXTS = [
  "Schmücke dein Selfie mit lustigen Stickern! Kronen, Brillen, Herzen, alles dabei!",
  "Klick auf einen Sticker und zieh ihn an die richtige Stelle. Wenn alles fertig ist, drück Foto machen!",
  "Perfekte Selfies! Du kannst Sticker ziehen, neue dazumachen, und ein Foto schießen. Zeig dein Lieblings-Selfie deinen Eltern!"
];

const engine = new TopicEngine({ audioPath: 'audio', sceneTexts: SCENE_TEXTS, onSceneLeave: (i) => { if (i === 1) stopCam(); } });

let stream = null, rafId = null;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stickerLayer = document.getElementById('stickerLayer');
let selectedSticker = null;

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stickerPicker').style.display = 'flex';
    document.getElementById('controlsRow').style.display = 'flex';
    document.getElementById('info').textContent = '👆 Klick einen Sticker, dann zieh ihn!';
    drawLoop();
  } catch (e) {
    document.getElementById('info').textContent = '😢 Keine Kamera-Erlaubnis.';
  }
}

function stopCam() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

function drawLoop() {
  if (!video.videoWidth) { rafId = requestAnimationFrame(drawLoop); return; }
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();
  rafId = requestAnimationFrame(drawLoop);
}

function addSticker(emoji) {
  const s = document.createElement('span');
  s.className = 'sticker';
  s.textContent = emoji;
  s.style.left = '50%';
  s.style.top = (30 + Math.random()*40) + '%';
  s.style.fontSize = '70px';
  attachDrag(s);
  stickerLayer.appendChild(s);
  selectSticker(s);
}

function attachDrag(el) {
  let startX, startY, startLeft, startTop, dragging = false;
  const studio = document.getElementById('studio');
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    selectSticker(el);
    dragging = true;
    const r = studio.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = (parseFloat(el.style.left)/100) * r.width || r.width/2;
    startTop = (parseFloat(el.style.top)/100) * r.height || r.height/2;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const r = studio.getBoundingClientRect();
    const nx = startLeft + (e.clientX - startX);
    const ny = startTop + (e.clientY - startY);
    el.style.left = (nx / r.width * 100) + '%';
    el.style.top = (ny / r.height * 100) + '%';
  });
  el.addEventListener('pointerup', () => { dragging = false; el.classList.remove('dragging'); });
  // double-click to grow
  el.addEventListener('dblclick', () => {
    const cur = parseFloat(el.style.fontSize) || 70;
    el.style.fontSize = (cur < 130 ? cur + 25 : 50) + 'px';
  });
}

function selectSticker(s) {
  if (selectedSticker) selectedSticker.classList.remove('selected');
  selectedSticker = s;
  s.classList.add('selected');
}

function removeSelected() {
  if (selectedSticker) {
    selectedSticker.remove();
    selectedSticker = null;
  }
}

function clearStickers() {
  stickerLayer.innerHTML = '';
  selectedSticker = null;
}

document.getElementById('studio').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'canvas' || e.target.id === 'studio') {
    if (selectedSticker) {
      selectedSticker.classList.remove('selected');
      selectedSticker = null;
    }
  }
});

function snapSelfie() {
  // Flash
  document.getElementById('flash').classList.remove('fire');
  void document.getElementById('flash').offsetWidth;
  document.getElementById('flash').classList.add('fire');
  // Compose output canvas: video frame + stickers
  const out = document.createElement('canvas');
  out.width = canvas.width;
  out.height = canvas.height;
  const octx = out.getContext('2d');
  // Draw the mirrored video
  octx.save();
  octx.scale(-1, 1);
  octx.drawImage(video, -out.width, 0, out.width, out.height);
  octx.restore();
  // Draw stickers at their positions
  const studio = document.getElementById('studio');
  const sr = studio.getBoundingClientRect();
  const scaleX = out.width / sr.width;
  const scaleY = out.height / sr.height;
  document.querySelectorAll('.sticker').forEach(s => {
    const r = s.getBoundingClientRect();
    const cx = (r.left + r.width/2 - sr.left) * scaleX;
    const cy = (r.top + r.height/2 - sr.top) * scaleY;
    const size = parseFloat(s.style.fontSize) * scaleX;
    octx.font = size + 'px serif';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(s.textContent, cx, cy);
  });
  // Shutter sound
  try {
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const t = c.currentTime;
    const o = c.createOscillator(); const g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'square'; o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(400, t+0.07);
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
    o.start(t); o.stop(t+0.1);
  } catch(e){}
  // Download
  out.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'selfie-' + new Date().toISOString().slice(0,10) + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
  document.getElementById('info').textContent = '💾 Foto gespeichert!';
}
</script>
</body>
</html>
