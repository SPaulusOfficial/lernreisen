<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-cache, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<title>A wie Affe</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(135deg, #fff8c8 0%, #d4ffd6 50%, #b5e8ff 100%); }

  .puzzle-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 900px;
    margin: 14px 0;
  }
  .target-letter-box {
    background: linear-gradient(135deg, #6a1b9a, #ec407a);
    color: #fff;
    font-size: 100px;
    font-weight: bold;
    width: 160px;
    height: 160px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(106,27,154,0.3);
    animation: target-wave 2s ease-in-out infinite;
  }
  @keyframes target-wave {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50%      { transform: scale(1.05) rotate(3deg); }
  }
  .word-display {
    font-size: 28px;
    color: #6a1b9a;
    font-weight: bold;
    text-align: center;
    background: rgba(255,255,255,0.9);
    padding: 10px 24px;
    border-radius: 18px;
  }

  .animal-choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    max-width: 800px;
    width: 95vw;
    margin: 12px 0;
  }
  .animal {
    background: rgba(255,255,255,0.9);
    border: 4px solid transparent;
    border-radius: 24px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    user-select: none;
  }
  .animal:hover { transform: translateY(-6px) scale(1.06); border-color: #ec407a; }
  .animal .emoji { font-size: 70px; display: block; transition: transform 0.3s; }
  .animal:hover .emoji { transform: scale(1.2) rotate(-8deg); }
  .animal .name { font-weight: bold; color: #6a1b9a; font-size: 18px; margin-top: 4px; }
  .animal.correct {
    animation: correct-cheer 0.8s cubic-bezier(.34,1.56,.64,1);
    background: linear-gradient(135deg, rgba(85,239,196,0.5), rgba(0,184,148,0.4));
    border-color: #00b894;
  }
  @keyframes correct-cheer {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(1); }
  }
  .animal.wrong { animation: wrong-shake 0.4s ease-in-out; }
  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    75%      { transform: translateX(8px); }
  }

  .stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 6px 0;
  }
  .stat {
    background: rgba(255,255,255,0.85);
    padding: 8px 18px;
    border-radius: 18px;
    font-weight: bold;
    color: #6a1b9a;
  }
</style>
</head>
<body>
<div id="app">
  <a class="home-btn" href="../../index.html">🏠</a>
  <button class="home-btn sound-btn" id="soundBtn">🔊</button>
  <div class="progress" id="progress"></div>

  <section class="scene active" data-scene="0">
    <div class="big-emoji floaty">🅰️🐵</div>
    <h1>A wie Affe</h1>
    <p>Jedes Tier fängt mit einem Buchstaben an.<br/><b>"A" wie "Affe"!</b> 🐵<br/>Welches Tier passt zum Buchstaben?</p>
    <button class="purple" onclick="engine.next()">Los geht's! 🐾</button>
  </section>

  <section class="scene" data-scene="1">
    <div class="puzzle-row">
      <div class="target-letter-box" id="targetLetter">A</div>
      <div class="word-display" id="wordDisplay">A wie ...?</div>
    </div>
    <div class="animal-choices" id="choices"></div>
    <div class="stats">
      <span class="stat">✅ Richtig: <span id="correct">0</span></span>
      <span class="stat">⏭️ Runde: <span id="round">1</span> / 10</span>
    </div>
    <button class="small secondary" onclick="newGame()" style="margin-top:6px">🔁 Neu</button>
    <button class="purple" onclick="engine.next()" style="margin-top:8px">Weiter ➡️</button>
  </section>

  <section class="scene" data-scene="2">
    <div class="big-emoji pulse">🅰️🐻🐱🐶</div>
    <h2>Tier-Buchstaben-Profi!</h2>
    <p>Jeder Buchstabe hat sein Lieblings-Tier! 🐾<br/>A wie Affe, B wie Bär, C wie ... Chamäleon! 🦎</p>
    <button class="green" onclick="engine.goTo(0)">🔁 Nochmal</button>
  </section>
</div>

<div class="nav"><button class="secondary" id="prevBtn">⬅️ Zurück</button></div>
<script src="../../shared/engine.js"></script>
<script>
const SCENE_TEXTS = [
  "Jedes Tier fängt mit einem Buchstaben an: A wie Affe! Welches Tier passt zum Buchstaben?",
  "Schau auf den großen Buchstaben. Welches Tier fängt mit diesem Buchstaben an? Klick es an!",
  "Tier-Buchstaben-Profi! Jeder Buchstabe hat sein Lieblings-Tier: A wie Affe, B wie Bär, C wie Chamäleon!"
];
const engine = new TopicEngine({ audioPath: 'audio', sceneTexts: SCENE_TEXTS, onSceneEnter: (i) => { if (i === 1) newGame(); } });

const ANIMALS = [
  { letter: 'A', emoji: '🐵', name: 'Affe' },
  { letter: 'B', emoji: '🐻', name: 'Bär' },
  { letter: 'C', emoji: '🦎', name: 'Chamäleon' },
  { letter: 'D', emoji: '🦕', name: 'Dino' },
  { letter: 'E', emoji: '🐘', name: 'Elefant' },
  { letter: 'F', emoji: '🐸', name: 'Frosch' },
  { letter: 'G', emoji: '🦒', name: 'Giraffe' },
  { letter: 'H', emoji: '🐴', name: 'Hund' },
  { letter: 'I', emoji: '🦔', name: 'Igel' },
  { letter: 'K', emoji: '🐱', name: 'Katze' },
  { letter: 'L', emoji: '🦁', name: 'Löwe' },
  { letter: 'M', emoji: '🐭', name: 'Maus' },
  { letter: 'N', emoji: '🦏', name: 'Nashorn' },
  { letter: 'P', emoji: '🐼', name: 'Panda' },
  { letter: 'Q', emoji: '🐙', name: 'Qualle' },
  { letter: 'R', emoji: '🐓', name: 'Rabe' },
  { letter: 'S', emoji: '🐍', name: 'Schlange' },
  { letter: 'T', emoji: '🐯', name: 'Tiger' },
  { letter: 'V', emoji: '🐦', name: 'Vogel' },
  { letter: 'W', emoji: '🐺', name: 'Wolf' },
  { letter: 'Z', emoji: '🦓', name: 'Zebra' }
];

let correct = 0, round = 1, currentAnswer = null;

function newGame() {
  correct = 0; round = 1;
  document.getElementById('correct').textContent = '0';
  document.getElementById('round').textContent = '1';
  nextRound();
}

function nextRound() {
  document.getElementById('round').textContent = String(round);
  // Pick target animal
  currentAnswer = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  document.getElementById('targetLetter').textContent = currentAnswer.letter;
  document.getElementById('wordDisplay').innerHTML = currentAnswer.letter + ' wie <b style="opacity:0.4">?</b>';
  // Build 4 choices including correct
  const choices = [currentAnswer];
  while (choices.length < 4) {
    const c = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    if (!choices.some(x => x.letter === c.letter)) choices.push(c);
  }
  choices.sort(() => Math.random() - 0.5);
  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  choices.forEach(a => {
    const el = document.createElement('div');
    el.className = 'animal';
    el.innerHTML = '<span class="emoji">' + a.emoji + '</span><div class="name">' + a.name + '</div>';
    el.onclick = () => check(el, a);
    grid.appendChild(el);
  });
  sayLetter(currentAnswer.letter);
}

function check(el, animal) {
  if (animal.letter === currentAnswer.letter) {
    el.classList.add('correct');
    document.getElementById('wordDisplay').innerHTML = currentAnswer.letter + ' wie <b>' + currentAnswer.name + '</b>!';
    sayTierClip(currentAnswer.name);
    sfx('yes');
    correct++;
    document.getElementById('correct').textContent = String(correct);
    setTimeout(() => {
      round++;
      if (round > 10) {
        document.getElementById('choices').innerHTML = '<div style="grid-column:1/-1;text-align:center;font-size:36px;color:#00b894;font-weight:bold;">🏆 ' + correct + ' / 10 — super!</div>';
        sfx('win');
      } else {
        nextRound();
      }
    }, 1500);
  } else {
    el.classList.add('wrong');
    sfx('no');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

const speakAudio = new Audio();
function playClip(key) {
  speakAudio.pause();
  speakAudio.currentTime = 0;
  speakAudio.src = 'audio/' + key + '.m4a?v=2';
  speakAudio.play().catch(() => {});
}
function sayLetter(letter) { playClip('letter_' + letter); }
function sayTierClip(animalName) { playClip('tier_' + animalName); }

let ac = null;
function sfx(type) {
  try {
    if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime;
    if (type === 'yes') {
      [800, 1200].forEach((f, i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.2);
        o.start(t + i*0.1); o.stop(t + i*0.1 + 0.22);
      });
    } else if (type === 'no') {
      const o = ac.createOscillator(); const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(280, t); o.frequency.exponentialRampToValueAtTime(150, t+0.25);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
      o.start(t); o.stop(t+0.32);
    } else if (type === 'win') {
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.25, t + i*0.1); g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.25);
        o.start(t + i*0.1); o.stop(t + i*0.1 + 0.3);
      });
    }
  } catch(e){}
}
</script>
</body>
</html>
