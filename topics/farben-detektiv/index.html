<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-cache, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<title>Farben-Detektiv</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(135deg, #ffd6e8 0%, #ffeaa7 30%, #b5e8ff 70%, #d4ffd6 100%); }
  h1, h2 { color: #6a1b9a; text-shadow: 2px 2px 0 #fff; }

  .detective-stage {
    position: relative;
    width: min(95vw, 640px);
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin: 12px 0;
    border: 4px solid #fff;
  }
  #video { display: none; }
  #canvas { width: 100%; height: 100%; display: block; }
  .focus-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 4px solid #ffd700;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: ring-pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5), inset 0 0 8px rgba(255,255,255,0.6);
  }
  .focus-ring::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ffd700;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  @keyframes ring-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.1); }
  }

  .color-display {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    padding: 14px 26px;
    border-radius: 24px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    margin: 8px 0;
  }
  .color-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ccc;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2), inset 0 0 12px rgba(255,255,255,0.3);
    transition: background 0.3s ease;
    border: 4px solid #fff;
  }
  .color-name {
    font-size: 38px;
    font-weight: bold;
    color: #6a1b9a;
    min-width: 180px;
    text-align: left;
    line-height: 1.1;
  }
  .color-name .emoji { font-size: 50px; display: inline-block; margin-right: 8px; }

  .palette {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 6px 0;
    max-width: min(95vw, 700px);
  }
  .pal {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
    cursor: default;
  }
  .pal.matched {
    transform: scale(1.6);
    box-shadow: 0 0 18px rgba(255,215,0,0.9);
    border-color: #ffd700;
    z-index: 5;
    position: relative;
  }

  .tip {
    background: rgba(255,255,255,0.85);
    padding: 10px 22px;
    border-radius: 18px;
    color: #6a1b9a;
    font-weight: bold;
    max-width: 600px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <a class="home-btn" href="../../index.html">🏠</a>
  <button class="home-btn sound-btn" id="soundBtn">🔊</button>
  <div class="progress" id="progress"></div>

  <section class="scene active" data-scene="0">
    <div class="big-emoji floaty">🔍🌈</div>
    <h1>Farben-Detektiv</h1>
    <p>Halt etwas Buntes vor die Kamera —<br/>sie sagt dir, welche Farbe es ist! 🌈</p>
    <button class="purple" onclick="engine.next()">Spielen! 🎨</button>
  </section>

  <section class="scene" data-scene="1">
    <div class="detective-stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="focus-ring"></div>
    </div>
    <button class="small green" id="startBtn" onclick="startCam()">📷 Kamera an</button>
    <div class="color-display" id="display" style="display:none">
      <div class="color-circle" id="colorCircle"></div>
      <div class="color-name" id="colorName"><span class="emoji">🎨</span>?</div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="tip" id="tip">Halt etwas in den weißen Kreis — was siehst du?</div>
    <button class="purple" onclick="engine.next()" style="margin-top:8px">Weiter ➡️</button>
  </section>

  <section class="scene" data-scene="2">
    <div class="big-emoji pulse">🌈🔍</div>
    <h2>Farben-Profi!</h2>
    <p>Geh durchs Haus und such jede Farbe — die Kamera erkennt sie alle! 🏠✨</p>
    <button class="green" onclick="engine.goTo(0)">🔁 Nochmal</button>
  </section>
</div>

<div class="nav"><button class="secondary" id="prevBtn">⬅️ Zurück</button></div>
<script src="../../shared/engine.js"></script>
<script>
const SCENE_TEXTS = [
  "Halt etwas Buntes vor die Kamera. Sie sagt dir, welche Farbe es ist!",
  "Halt etwas in den weißen Kreis in der Mitte! Die Kamera erkennt die Farbe und sagt sie dir!",
  "Farben-Profi! Geh durchs Haus und such jede Farbe, die Kamera erkennt sie alle!"
];

const engine = new TopicEngine({ audioPath: 'audio', sceneTexts: SCENE_TEXTS, onSceneLeave: (i) => { if (i === 1) stopCam(); } });

// Colors with hue (0-360), sat (0-1), val (0-1) baselines for fine matching.
// Grayscale (Schwarz/Grau/Weiß) handled separately by value+saturation.
const COLORS = [
  { name: 'Rot',          hex: '#e63946', hue: 354, emoji: '🔴' },
  { name: 'Dunkelrot',    hex: '#8b1e2d', hue: 354, emoji: '🔴', dark: true },
  { name: 'Hellrot',      hex: '#ff8a8a', hue: 0,   emoji: '🔴', light: true },
  { name: 'Orange',       hex: '#ff7b00', hue: 28,  emoji: '🟠' },
  { name: 'Hellorange',   hex: '#ffb366', hue: 28,  emoji: '🟠', light: true },
  { name: 'Gelb',         hex: '#fcd116', hue: 50,  emoji: '🟡' },
  { name: 'Senfgelb',     hex: '#c8a200', hue: 48,  emoji: '🟡', dark: true },
  { name: 'Hellgelb',     hex: '#fff2a8', hue: 54,  emoji: '🟡', light: true },
  { name: 'Hellgrün',     hex: '#a8e6a8', hue: 120, emoji: '🟢', light: true },
  { name: 'Grün',         hex: '#2ecc71', hue: 145, emoji: '🟢' },
  { name: 'Dunkelgrün',   hex: '#155a30', hue: 145, emoji: '🟢', dark: true },
  { name: 'Türkis',       hex: '#1abc9c', hue: 168, emoji: '🟢' },
  { name: 'Hellblau',     hex: '#74b9ff', hue: 210, emoji: '🔵', light: true },
  { name: 'Blau',         hex: '#0984e3', hue: 210, emoji: '🔵' },
  { name: 'Dunkelblau',   hex: '#0a3d8e', hue: 215, emoji: '🔵', dark: true },
  { name: 'Lila',         hex: '#8e44ad', hue: 280, emoji: '🟣' },
  { name: 'Violett',      hex: '#5e1cab', hue: 270, emoji: '🟣', dark: true },
  { name: 'Pink',         hex: '#ff4d8d', hue: 335, emoji: '💗' },
  { name: 'Rosa',         hex: '#ffb1c8', hue: 340, emoji: '💗', light: true },
  { name: 'Hautfarbe',    hex: '#ffd3b6', hue: 25,  emoji: '🤝', light: true },
  { name: 'Braun',        hex: '#8b4513', hue: 25,  emoji: '🟤', dark: true },
  { name: 'Beige',        hex: '#e8d6b5', hue: 38,  emoji: '🟫', light: true },
  // Greyscale handled separately, but include for swatch display
  { name: 'Weiß',         hex: '#fafafa', hue: 0,   emoji: '⚪', gray: 'white' },
  { name: 'Hellgrau',     hex: '#bdbdbd', hue: 0,   emoji: '🩶', gray: 'light' },
  { name: 'Grau',         hex: '#7c7c7c', hue: 0,   emoji: '🩶', gray: 'mid' },
  { name: 'Dunkelgrau',   hex: '#3a3a3a', hue: 0,   emoji: '⚫', gray: 'dark' },
  { name: 'Schwarz',      hex: '#0c0c0c', hue: 0,   emoji: '⚫', gray: 'black' }
];

// RGB → HSV (h: 0-360, s: 0-1, v: 0-1)
function rgbToHsv(r, g, b) {
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  const v = mx;
  const s = mx === 0 ? 0 : (mx - mn) / mx;
  let h = 0;
  if (mx === mn) h = 0;
  else if (mx === r) h = ((g-b)/(mx-mn) + (g<b ? 6 : 0)) * 60;
  else if (mx === g) h = ((b-r)/(mx-mn) + 2) * 60;
  else h = ((r-g)/(mx-mn) + 4) * 60;
  return { h, s, v };
}

function hueDist(a, b) {
  const d = Math.abs(a - b);
  return Math.min(d, 360 - d);
}

function findColor(r, g, b) {
  const { h, s, v } = rgbToHsv(r, g, b);
  // Grayscale: low saturation
  if (s < 0.18) {
    if (v < 0.12) return COLORS.find(c => c.gray === 'black');
    if (v < 0.35) return COLORS.find(c => c.gray === 'dark');
    if (v < 0.6)  return COLORS.find(c => c.gray === 'mid');
    if (v < 0.85) return COLORS.find(c => c.gray === 'light');
    return COLORS.find(c => c.gray === 'white');
  }
  // Brown special case: orange/red hue with low brightness
  if (h >= 10 && h <= 45 && v < 0.45 && s > 0.4) {
    return COLORS.find(c => c.name === 'Braun');
  }
  // Skin / beige special: warm hue with high value, moderate saturation
  if (h >= 15 && h <= 35 && v > 0.75 && s > 0.18 && s < 0.45) {
    return COLORS.find(c => c.name === 'Hautfarbe');
  }
  // Determine darkness/lightness tag
  let tag = null;
  if (v < 0.42) tag = 'dark';
  else if (v > 0.82 && s < 0.55) tag = 'light';
  // Find color among non-gray with closest hue, matching tag preference
  let best = null, bestScore = Infinity;
  for (const c of COLORS) {
    if (c.gray) continue;
    const d = hueDist(h, c.hue);
    let score = d;
    if (tag === 'dark' && !c.dark) score += 30;
    if (tag === 'light' && !c.light) score += 30;
    if (!tag && (c.dark || c.light)) score += 25;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  return best;
}

let stream = null, rafId = null, sampleTimer = null;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let lastSpoken = null;

// Build palette
const palette = document.getElementById('palette');
COLORS.forEach(c => {
  const p = document.createElement('div');
  p.className = 'pal';
  p.dataset.name = c.name;
  p.style.background = c.hex;
  p.title = c.name;
  palette.appendChild(p);
});

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('display').style.display = 'flex';
    drawLoop();
    sampleTimer = setInterval(sample, 250);
  } catch (e) {
    document.getElementById('tip').textContent = '😢 Keine Kamera-Erlaubnis.';
  }
}

function stopCam() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (sampleTimer) { clearInterval(sampleTimer); sampleTimer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

function drawLoop() {
  if (!video.videoWidth) { rafId = requestAnimationFrame(drawLoop); return; }
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();
  rafId = requestAnimationFrame(drawLoop);
}

const recentSamples = []; // stability: last few detected color names
const STABILITY_WINDOW = 4; // must be detected this many times before announcing

function sample() {
  if (!video.videoWidth) return;
  // Tighter center sample: ~6% of frame, only the center circle area
  const cx = canvas.width/2, cy = canvas.height/2;
  const radius = Math.max(24, Math.floor(canvas.width / 18));
  const sx = cx - radius, sy = cy - radius;
  const sw = radius * 2, sh = radius * 2;
  const img = ctx.getImageData(sx, sy, sw, sh);
  const d = img.data;
  let r = 0, g = 0, b = 0, count = 0;
  const r2 = radius * radius;
  // Iterate every pixel inside the circle (more accurate average)
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const dx = x - radius, dy = y - radius;
      if (dx*dx + dy*dy > r2) continue;
      const i = (y * sw + x) * 4;
      r += d[i]; g += d[i+1]; b += d[i+2]; count++;
    }
  }
  if (count === 0) return;
  r /= count; g /= count; b /= count;

  const best = findColor(r, g, b);
  // Show the live raw color in the circle immediately
  document.getElementById('colorCircle').style.background = 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';

  // Stability: only commit a name after seeing it consistently
  recentSamples.push(best.name);
  if (recentSamples.length > STABILITY_WINDOW) recentSamples.shift();
  const counts = {};
  recentSamples.forEach(n => counts[n] = (counts[n] || 0) + 1);
  let stableName = best.name, stableCount = 0;
  for (const k in counts) if (counts[k] > stableCount) { stableCount = counts[k]; stableName = k; }
  // Need at least majority of window for a stable detection
  if (stableCount < Math.ceil(STABILITY_WINDOW * 0.6)) return;
  const stable = COLORS.find(c => c.name === stableName);

  document.getElementById('colorName').innerHTML = '<span class="emoji">' + stable.emoji + '</span>' + stable.name;
  document.querySelectorAll('.pal').forEach(p => p.classList.toggle('matched', p.dataset.name === stable.name));
  document.getElementById('tip').textContent = '👀 Ich sehe: ' + stable.name + '!';
  if (stable.name !== lastSpoken) {
    speak(stable.name);
    lastSpoken = stable.name;
  }
}

const colorAudio = new Audio();
function speak(colorName) {
  colorAudio.pause();
  colorAudio.currentTime = 0;
  colorAudio.src = 'audio/farbe_' + colorName + '.m4a?v=2';
  colorAudio.play().catch(() => {});
}
</script>
</body>
</html>
